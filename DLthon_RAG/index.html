<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonFrame AI</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <header>
        <h1>네컷 팀프로젝트</h1>
        <p>한 줄 아이디어를 AI 4컷 만화로 만들어보세요</p>
    </header>


    <section class="card">

        <h2>1. 그림 스타일 선택</h2>

        <label class="upload-box">

            <input 
                type="file" 
                id="styleImage"
                accept="image/*"
            >

            <span>
                이미지 업로드
            </span>

        </label>

        <img 
            id="preview"
            class="preview"
        >

    </section>



    <section class="card">

        <h2>2. 만화 내용 입력</h2>

        <textarea
            id="prompt"
            placeholder="예) 퇴근 후 운동하려 했지만 침대와 하나가 되는 나"
        ></textarea>


        <button id="generateBtn">
            4컷 만화 생성하기
        </button>

    </section>



    <section class="card result">

        <h2>결과</h2>

        <div id="loading">
            AI가 만화를 그리고 있습니다...
        </div>


        <div 
            id="comicGrid"
            class="comic-grid"
        >

        </div>


    </section>


</div>


<script src="app.js"></script>

</body>
</html>
